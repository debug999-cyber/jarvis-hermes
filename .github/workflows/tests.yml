name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pyyaml ruff
      - run: ruff check .
      - run: python -m pytest tests -q
      - run: bash -n install.sh bin/jarvis scripts/setup_cron.sh app/build.sh
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning install.sh bin/jarvis scripts/setup_cron.sh app/build.sh
      - name: Swift app compiles
        if: runner.os == 'macOS'
        run: bash app/build.sh "$RUNNER_TEMP/JARVIS.app" && test -x "$RUNNER_TEMP/JARVIS.app/Contents/MacOS/JARVIS"
  hud-e2e:
    # Настоящий браузер против HUD в demo-режиме: страница грузится без ошибок JS, чат отвечает, панели/события работают
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest playwright && python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -q
