# Линтер проекта: ruff check .   (CI запускает то же самое)
line-length = 140
target-version = "py311"
extend-exclude = ["app/make_icon.py"]

[lint]
select = ["E", "F", "W", "B", "UP", "RUF100"]
ignore = [
  "E501",   # длина строк — на совести автора, комментарии на русском длинные
  "E701", "E702",  # компактные однострочники в CLI-парсерах
  "B008",   # вызовы в аргументах по умолчанию
  "E731",   # короткие lambda-помощники внутри функций
  "UP007", "UP035", "UP006",  # совместимость аннотаций с Python 3.9 в тестах
]

[lint.per-file-ignores]
"tests/*" = ["B"]
